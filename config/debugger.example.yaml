project:
  name: "Valhalla POI Debugger"

valhalla:
  service_url: "http://localhost:8002"
  status_path: "/status"
  route_path: "/route"
  timeout_seconds: 20

  # Optional Candidate Analysis build/extraction diagnostics.
  association_debug_jsonl_path: ""

osrm:
  service_url: "http://10.71.8.14/DE-5000"
  profile: "driving"
  route_path: "/route/v1"
  nearest_path: "/nearest/v1"
  timeout_seconds: 20

  # Must come from the same osrm-extract execution as the running
  # .osrm dataset when OSRM Candidate Analysis is enabled.
  landmark_debug_jsonl_path: ""

engine:
  # Kept configurable now; later phases can use this for tile/build/debug helpers.
  root: ""

# Relative paths are resolved from the repository root.
data:
  pbf_path: ""
  poi_geojson_path: "./data/landmarks.geojson"
  poi_csv_path: ""

frontend:
  map_style_url: "https://tiles.openfreemap.org/styles/liberty"
  # MapLibre coordinate order: [longitude, latitude]
  default_center: [77.2090, 28.6139]
  default_zoom: 11

backend:
  # Listen on every interface so coworkers can reach the API through this
  # machine's LAN/VPN IP address. Restrict access at the firewall/VPN layer.
  host: "0.0.0.0"
  port: 8010

  # Production serves the frontend and /api from the same origin, so CORS
  # is disabled by default. Add explicit origins only when required.
  allowed_origins: []

  # Persistent, rebuildable SQLite POI indexes. Relative paths use the repo root.
  poi_index_dir: "./.cache/poi-search"


# Phase 2A dataset registry example. The old `data:` block still works as a fallback.
active_dataset: "example"

datasets:
  example:
    name: "Example landmark dataset"
    pbf_path: ""
    poi_csv_path: ""
    # Optional fallback if no CSV exists:
    poi_geojson_path: "./data/landmarks.geojson"
    # Metadata only in Phase 2A; activating a dataset does NOT restart Valhalla.
    tiles_path: ""
    valhalla_config_path: ""

    # Optional dataset-specific Candidate Analysis evidence.
    # These take precedence over the global engine-side paths above.
    valhalla_association_debug_jsonl_path: ""
    osrm_landmark_debug_jsonl_path: ""

  # Official company schema: navigation_landmark, poi_id, landmark_type,
  # landmark_priority, and landmark_visible. This remains debugger-only metadata.
  cp_official_lmg:
    name: "CP - Official LMG"
    pbf_path: "/home/cn004231/harsh/poi_official_data/delhi_small_lmg.osm.pbf"
    poi_csv_path: "./data/cp_official_lmg.landmarks.csv"

  rohtak_lmg:
    name: "Rohtak - Official LMG"
    pbf_path: "/home/cn004231/harsh/poi_official_data/Rohtak/rohtak_lmg.osm.pbf"
    poi_csv_path: "./data/rohtak_lmg.landmarks.csv"
    osrm_landmark_debug_jsonl_path: "./data/rohtak_lmg.turn_debug_v2.jsonl"
    # MapLibre bounds: [[west, south], [east, north]].
    map_bounds: [[76.472397, 28.832644], [76.701050, 28.954681]]

  mix_data:
    name: "Mix Data - Official LMG"
    pbf_path: "/home/cn004231/harsh/poi_official_data/mix_data/mix_data.osm.pbf"
    poi_csv_path: "./data/mix_data.landmarks.csv"
    # MapLibre bounds: [[west, south], [east, north]].
    map_bounds: [[76.493683, 28.086520], [77.857361, 29.006939]]

  new_data:
    name: "New Data - 16 SEPT"
    pbf_path: "/home/cn004231/harsh/poi_official_data/New_Data/NextGen_All_India_Driving_LMG_v2026.08.pbf"
    poi_csv_path: "./data/weekly_2026_08.landmarks.csv"
    # MapLibre bounds: [[west, south], [east, north]].
    map_bounds: [[68.4929560,5.3313580], [97.0461940,36.8764500]]  

# Phase 3A saved route scenarios
scenarios:
  directory: "./data/scenarios"
